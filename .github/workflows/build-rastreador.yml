
name: Gerar APK SIGA Rastreador

on:
  workflow_dispatch:
  push:
    paths:
      - 'siga_rastreador/**'
      - '.github/workflows/build-rastreador.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Selecionar Java 17 no Flutter
        run: |
          flutter config --jdk-dir="$JAVA_HOME"
          java -version
          flutter doctor -v

      - name: Preparar projeto Android
        working-directory: siga_rastreador
        run: flutter create --platforms=android --org br.com.siga .

      - name: Instalar dependencias
        working-directory: siga_rastreador
        run: flutter pub get

      - name: Gerar ícone do rastreador
        working-directory: siga_rastreador
        run: dart run flutter_launcher_icons

      - name: Gerar APK
        working-directory: siga_rastreador
        run: flutter build apk --debug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: SIGA-Rastreador-Android
          path: siga_rastreador/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
