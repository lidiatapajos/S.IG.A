name: siga_rastreador
description: Rastreador GPS Android de aparelhos autorizados para o SIGA.
publish_to: 'none'
version: 0.1.0+1
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  geolocator: 13.0.4
  http: 1.2.2
  flutter_foreground_task: 9.2.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/logo/brasao_siga.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/logo/brasao_siga.png